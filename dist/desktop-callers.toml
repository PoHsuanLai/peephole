# The desktop's own processes: which program is which, and the role it plays.
#
# One shipped table, root-owned: /etc/quire/desktop-callers.toml, with additions for an
# administrator or a developer in /etc/quire/desktop-callers.d/*.toml. peephole reads no user
# file: nothing a person's file says makes a process more trusted. A file that is not owned by
# root alone is refused, and so is any file whose directory is writable by someone else.
#
# A row with a `unit` is a service: the process must sit in that unit's cgroup and run one of the
# `exe` images (root-owned all the way up). A consumer that asks for `Full` also needs the unit
# manager to confirm the unit (root-owned definition, not transient, no user drop-in, this
# process as its main process, this program as its ExecStart). A row with no `unit` is a program
# known by its image alone; its ceiling is `Exe`. `exe` is required: a unit name alone proves
# nothing. In an `exe` path a `*` stands for any run of characters inside one path segment.
#
# This sample is what the release lane generates from release/exports.toml and build.sh, so a
# moved binary updates the table in the same bundle. Role names are the constants of
# `peephole-core`'s `roles` module (feature `desktop`).

# The shell: draws the desktop and asks the person on behalf of other programs.
[[peer]]
app  = "org.quire.Shell"
unit = "sill.service"
exe  = [
  "/opt/quire/releases/*/bin/sill",
  "/opt/quire/current/bin/sill",
  "/usr/local/bin/sill",
  "/usr/bin/sill",
]
role = "shell"

# The portal backend: asks the shell, is handed an input socket, captures the screen.
[[peer]]
app  = "org.quire.Portal"
unit = "transom.service"
exe  = [
  "/opt/quire/releases/*/libexec/transom",
  "/opt/quire/releases/*/bin/transom",
  "/usr/libexec/transom",
]
role = "portal"

# The portal frontend (Ubuntu and Fedora / Arch paths). The only caller of the backend.
[[peer]]
app  = "org.freedesktop.portal.Desktop"
unit = "xdg-desktop-portal.service"
exe  = [
  "/usr/libexec/xdg-desktop-portal",
  "/usr/lib/xdg-desktop-portal",
]
role = "portal_frontend"

# The compositor.
[[peer]]
app  = "org.quire.Compositor"
unit = "casement.service"
exe  = [
