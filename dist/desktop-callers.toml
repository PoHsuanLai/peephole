# May create security contexts for the sandboxes it starts.
[[peer]]
app  = "org.quire.Flatpak"
exe  = [
  "/usr/bin/flatpak",
]
role = "sandbox_launcher"

# The unit manager: its answers about units are believed only from this image.
[[peer]]
app  = "org.freedesktop.systemd1"
exe  = [
  "/usr/lib/systemd/systemd",
  "/lib/systemd/systemd",
]
role = "manager"
