[package]
name = "peephole-core"
description = "Which program is calling: ids, the caller table, the facts about a process, and the pure judgement over them. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }

[features]
# `toml`: `Table::from_toml`, the caller table's text format. On by default; a vocabulary crate that
# only names the types (porter-core re-exports `CgroupPath`) turns default features off.
default = ["toml"]
toml = ["dep:toml"]
# `roles`: the role names of this desktop's own processes, so nobody types the strings twice.
desktop = []
# Developer rows: rows read from a file a person owns, which let that person's own programs
# (a checkout-built stand-in) take a service's role at `Proof::Dev`, below every real proof. A
# shipped program never enables it; the desktop gate greps `cargo tree -e features` for it. See
# README "Developer rows".
dev-rows = ["toml"]

[lints]
workspace = true
