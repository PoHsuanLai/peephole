[package]
name = "peephole-bus"
description = "Which program is calling, over the session or system bus: a sender's pinned process, its unit as the unit manager states it, and the check a method makes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
peephole = { workspace = true }
peephole-core = { workspace = true }
zbus = { workspace = true }
futures-timer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
# zbus runs on its own executor by default. A tokio program turns `default-features` off and
# `tokio` on: zbus then runs on that runtime and `Offload::Tokio` becomes available.
default = ["async-io"]
async-io = ["zbus/async-io"]
tokio = ["dep:tokio", "zbus/tokio"]
# Test seams (`BusPeers::introduce`); a shipped binary never enables it.
fake = ["peephole/fake"]
# Forwarded to peephole-core (`roles`).
desktop = ["peephole/desktop"]
# Forwarded to peephole-core (developer rows). Never shipped.
dev-rows = ["peephole/dev-rows"]

[lints]
workspace = true

[dev-dependencies]
peephole = { workspace = true, features = ["fake"] }
tempfile = { workspace = true }

# One integration binary that needs the `fake` seams (an introduced standing, a fixture tree).
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["fake"]
